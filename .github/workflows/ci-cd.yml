# MXWatch CI/CD: lint, tipos y build; deploy solo en push a main
name: MXWatch CI/CD

# Disparadores: pushes y pull requests a las ramas principales
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# Cancela ejecuciones previas del mismo ref para no gastar minutos de CI
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Permisos mínimos: solo lectura del repositorio
permissions:
  contents: read

jobs:
  # Job 1: lint y verificación de formato con Biome
  lint:
    name: Biome
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 1. Clona el repositorio
      - name: Checkout code
        uses: actions/checkout@v7

      # 2. Configura Node, Bun y dependencias con caché
      - name: Setup Bun env
        uses: ./.github/actions/setup

      # 3. Lint y formato en una sola pasada, sin escribir archivos
      - name: Biome CI
        run: bunx biome ci .

      # 4. Verifica que las traducciones estén completas y sin claves huérfanas
      - name: Translation check
        run: bun run check:i18n

  # Job 2: verificación de tipos con el compilador de TypeScript
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 1. Clona el repositorio
      - name: Checkout code
        uses: actions/checkout@v7

      # 2. Configura Node, Bun y dependencias con caché
      - name: Setup Bun env
        uses: ./.github/actions/setup

      # 3. Valida los tipos sin emitir archivos
      - name: Typecheck
        run: bun run typecheck

  # Job 3: compila el sitio para detectar errores de build antes de fusionar
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 1. Clona el repositorio
      - name: Checkout code
        uses: actions/checkout@v7

      # 2. Configura Node, Bun y dependencias con caché
      - name: Setup Bun env
        uses: ./.github/actions/setup

      # 3. Compila con Next.js
      - name: Build Next.js
        run: bun run build

  # Job 4: despliegue en Cloudflare con OpenNext (solo push a main)
  deploy:
    name: Deploy to Cloudflare
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [lint, typecheck, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # 1. Clona el repositorio
      - name: Checkout code
        uses: actions/checkout@v7

      # 2. Configura Node, Bun y dependencias con caché
      - name: Setup Bun env
        uses: ./.github/actions/setup

      # 3. Compila con OpenNext
      - name: Build with OpenNext
        run: bun run build:cf

      # 4. Despliega en Cloudflare
      - name: Deploy to Cloudflare
        run: bunx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ---------------------------------------------------------------------------
  # Escaneo de secretos. Workflow reutilizable definido en ivndv/.github
  # ---------------------------------------------------------------------------
  gitleaks:
    uses: ivndv/.github/.github/workflows/gitleaks.yml@main
